<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سجل المشاهدة</title>
  <style>
    :root {
      --bg: #f6f1ea;
      --panel: #fffdfb;
      --card: #ffffff;
      --text: #1f1b2a;
      --muted: #6d6878;
      --line: #e5ded5;
      --accent: #c2410c;
      --accent-2: #f59e0b;
      --green: #15803d;
      --shadow: 0 10px 25px rgba(22, 18, 28, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Cairo", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn.primary {
      background: var(--accent);
      color: white;
    }

    .btn.secondary {
      background: #f3e9de;
      color: var(--text);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 18px;
    }

    form {
      display: grid;
      gap: 12px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .row.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      padding: 11px 12px;
      font: inherit;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid rgba(194, 65, 12, 0.15);
      border-color: rgba(194, 65, 12, 0.45);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.3fr 0.8fr 0.8fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 1.5rem;
      color: var(--accent);
    }

    .stat span {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 0 10px;
      gap: 10px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      display: grid;
      gap: 10px;
    }

    .card.want { border-inline-start: 4px solid var(--accent-2); }
    .card.active { border-inline-start: 4px solid var(--green); }
    .card.done { border-inline-start: 4px solid var(--green); }

    .line1 {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: flex-start;
    }

    .meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .title {
      font-weight: 700;
      font-size: 1.05rem;
      word-break: break-word;
    }

    .status {
      border: 1px solid var(--line);
      background: #faf7f4;
      color: var(--text);
      border-radius: 10px;
      padding: 7px 9px;
      font-size: 0.78rem;
      min-width: 110px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .badge {
      background: #f5efe8;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
    }

    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .mini-btn {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
    }

    .progress {
      height: 8px;
      background: #eee7df;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--green), #34d399);
      border-radius: inherit;
    }

    .star-row {
      display: flex;
      gap: 5px;
      direction: ltr;
    }

    .star {
      border: none;
      background: transparent;
      color: #d0c7bd;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0;
    }

    .star.active {
      color: var(--accent-2);
    }

    .empty {
      color: var(--muted);
      padding: 10px 4px;
    }

    @media (max-width: 560px) {
      .row, .row.three, .toolbar, .stats {
        grid-template-columns: 1fr;
      }
      .line1 {
        flex-direction: column;
        align-items: stretch;
      }
      .status {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1>سجل المشاهدة</h1>
      <button class="btn secondary" id="randomBtn" type="button">وش أشاهد؟</button>
    </div>

    <div class="panel">
      <form id="form">
        <div class="row">
          <input id="title" type="text" placeholder="اسم الفيلم أو المسلسل" required />
          <select id="type">
            <option value="movie">فيلم</option>
            <option value="series">مسلسل</option>
          </select>
        </div>

        <div class="row">
          <select id="genre"></select>
          <select id="platform"></select>
        </div>

        <div class="row">
          <select id="status">
            <option value="want">أبغى أشاهده</option>
            <option value="active" selected>أتابعه الآن</option>
            <option value="done">شاهدته</option>
          </select>
          <input id="note" type="text" placeholder="ملاحظة أو من رشّحه لك" />
        </div>

        <div class="row three" id="seriesFields">
          <input id="season" type="number" min="1" placeholder="الموسم" />
          <input id="episode" type="number" min="0" placeholder="الحلقة" />
          <input id="totalEpisodes" type="number" min="1" placeholder="إجمالي الحلقات" />
        </div>

        <button class="btn primary" type="submit">إضافة</button>
      </form>
    </div>

    <div class="stats">
      <div class="stat"><strong id="countTotal">0</strong><span>إجمالي</span></div>
      <div class="stat"><strong id="countDone">0</strong><span>مكتمل</span></div>
      <div class="stat"><strong id="countWant">0</strong><span>أبغى أشاهده</span></div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <input id="search" type="search" placeholder="بحث بالاسم أو الملاحظة" />
        <select id="filterGenre"></select>
        <select id="sortBy">
          <option value="new">الأحدث</option>
          <option value="name">الاسم</option>
          <option value="rating">التقييم</option>
        </select>
      </div>

      <div id="list"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'watch-tracker-v1';
    const genres = [
      'أكشن', 'كوميدي', 'دراما', 'رعب', 'رومانسي', 'خيال علمي',
      'وثائقي', 'أنمي', 'غموض', 'فانتازيا', 'أخرى'
    ];
    const platforms = ['نتفليكس', 'شاهد', 'ديزني+', 'برايم فيديو', 'يوتيوب', 'سينما', 'أخرى'];
    let items = loadItems();

    const elements = {
      form: document.getElementById('form'),
      title: document.getElementById('title'),
      type: document.getElementById('type'),
      genre: document.getElementById('genre'),
      platform: document.getElementById('platform'),
      status: document.getElementById('status'),
      note: document.getElementById('note'),
      season: document.getElementById('season'),
      episode: document.getElementById('episode'),
      totalEpisodes: document.getElementById('totalEpisodes'),
      search: document.getElementById('search'),
      filterGenre: document.getElementById('filterGenre'),
      sortBy: document.getElementById('sortBy'),
      list: document.getElementById('list'),
      randomBtn: document.getElementById('randomBtn'),
      countTotal: document.getElementById('countTotal'),
      countDone: document.getElementById('countDone'),
      countWant: document.getElementById('countWant'),
      seriesFields: document.getElementById('seriesFields')
    };

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const data = raw ? JSON.parse(raw) : [];
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function saveItems() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch {}
    }

    function labelForStatus(type, status) {
      if (status === 'want') return 'أبغى أشاهده';
      if (status === 'done') return type === 'series' ? 'انتهيت منه' : 'شاهدته';
      return type === 'series' ? 'أتابعه الآن' : 'لم أشاهده بعد';
    }

    function populateSelect(select, options, includeAll = false) {
      const opts = includeAll ? ['<option value="">الكل</option>'] : [];
      select.innerHTML = opts.concat(options.map(value => `<option value="${value}">${value}</option>`)).join('');
    }

    function updateTypeFields() {
      const isSeries = elements.type.value === 'series';
      elements.seriesFields.style.display = isSeries ? 'grid' : 'none';
    }

    function renderFilters() {
      populateSelect(elements.genre, genres);
      populateSelect(elements.platform, platforms);
      populateSelect(elements.filterGenre, genres, true);
    }

    function getFilteredItems() {
      const q = elements.search.value.trim().toLowerCase();
      const genre = elements.filterGenre.value;
      const sort = elements.sortBy.value;

      let result = items.filter(item => {
        const matchesText = !q || (item.title + ' ' + (item.note || '')).toLowerCase().includes(q);
        const matchesGenre = !genre || item.genre === genre;
        return matchesText && matchesGenre;
      });

      result.sort((a, b) => {
        if (sort === 'rating') return (b.rating || 0) - (a.rating || 0);
        if (sort === 'name') return a.title.localeCompare(b.title, 'ar');
        return (b.id || 0) - (a.id || 0);
      });

      return result;
    }

    function statusBadgeClass(status) {
      if (status === 'done') return 'done';
      if (status === 'want') return 'want';
      return 'active';
    }

    function renderList() {
      const filtered = getFilteredItems();
      const groups = [
        ['active', 'أتابعه الآن'],
        ['want', 'أبغى أشاهده'],
        ['done', 'انتهيت منه']
      ];

      let html = '';
      groups.forEach(([status, title]) => {
        const groupItems = filtered.filter(item => item.status === status);
        if (!groupItems.length) return;

        html += `<div class="section-head"><h2>${title} (${groupItems.length})</h2></div>`;
        html += groupItems.map(item => renderCard(item)).join('');
      });

      if (!html) {
        html = '<div class="empty">لا توجد عناصر مطابقة. ابدأ بإضافة فيلم أو مسلسل.</div>';
      }

      elements.list.innerHTML = html;

      updateStats();
    }

    function renderCard(item) {
      const isSeries = item.type === 'series';
      const progressPct = isSeries && item.totalEpisodes ? Math.min(100, ((item.episode || 0) / item.totalEpisodes) * 100) : 0;
      const metaParts = [item.genre, item.platform].filter(Boolean);
      const meta = metaParts.join(' • ') || 'بدون تصنيف';

      return `
        <article class="card ${statusBadgeClass(item.status)}" data-id="${item.id}">
          <div class="line1">
            <div>
              <div class="title">${escapeHtml(item.title)}</div>
              <div class="meta">${escapeHtml(meta)}</div>
            </div>
            <select class="status" data-role="status" data-id="${item.id}">
              <option value="want" ${item.status === 'want' ? 'selected' : ''}>${labelForStatus(item.type, 'want')}</option>
              <option value="active" ${item.status === 'active' ? 'selected' : ''}>${labelForStatus(item.type, 'active')}</option>
              <option value="done" ${item.status === 'done' ? 'selected' : ''}>${labelForStatus(item.type, 'done')}</option>
            </select>
          </div>

          ${isSeries ? `
            <div class="progress"><span style="width:${progressPct}%"></span></div>
            <div class="controls">
              <button class="mini-btn" type="button" data-role="season-down" data-id="${item.id}">−</button>
              <span>الموسم ${item.season || 1}</span>
              <button class="mini-btn" type="button" data-role="season-up" data-id="${item.id}">＋</button>
              <span>الحلقة ${item.episode || 0}</span>
              <button class="mini-btn" type="button" data-role="episode-down" data-id="${item.id}">−</button>
              <button class="mini-btn" type="button" data-role="episode-up" data-id="${item.id}">＋</button>
              <button class="btn secondary" type="button" data-role="delete" data-id="${item.id}" style="padding:7px 10px;font-size:0.8rem;">حذف</button>
            </div>
          ` : `
            <div class="controls">
              <span>فيلم</span>
              <button class="btn secondary" type="button" data-role="delete" data-id="${item.id}" style="padding:7px 10px;font-size:0.8rem;">حذف</button>
            </div>
          `}

          ${(item.note || item.platform) ? `
            <div class="badges">
              ${item.platform ? `<span class="badge">${escapeHtml(item.platform)}</span>` : ''}
              ${item.note ? `<span class="badge">${escapeHtml(item.note)}</span>` : ''}
            </div>
          ` : ''}

          ${item.status === 'done' ? `
            <div class="star-row">
              ${[1,2,3,4,5].map(v => `<button class="star ${v <= (item.rating || 0) ? 'active' : ''}" type="button" data-role="rate" data-id="${item.id}" data-v="${v}">★</button>`).join('')}
            </div>
          ` : ''}
        </article>
      `;
    }

    function updateStats() {
      elements.countTotal.textContent = items.length;
      elements.countDone.textContent = items.filter(item => item.status === 'done').length;
      elements.countWant.textContent = items.filter(item => item.status === 'want').length;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function findItem(id) {
      return items.find(item => item.id === Number(id));
    }

    function addItem(event) {
      event.preventDefault();
      const title = elements.title.value.trim();
      if (!title) return;

      const item = {
        id: Date.now(),
        title,
        type: elements.type.value,
        genre: elements.genre.value,
        platform: elements.platform.value,
        status: elements.status.value,
        note: elements.note.value.trim(),
        season: Number(elements.season.value) || 1,
        episode: Number(elements.episode.value) || 0,
        totalEpisodes: Number(elements.totalEpisodes.value) || 0,
        rating: 0
      };

      items.unshift(item);
      saveItems();
      elements.form.reset();
      updateTypeFields();
      renderList();
    }

    function updateStatus(id, status) {
      const item = findItem(id);
      if (!item) return;
      item.status = status;
      if (status === 'done' && !item.doneAt) item.doneAt = Date.now();
      saveItems();
      renderList();
    }

    function changeEpisode(id, delta) {
      const item = findItem(id);
      if (!item || item.type !== 'series') return;
      item.episode = Math.max(0, (item.episode || 0) + delta);
      if (item.episode > 0 && item.status === 'want') item.status = 'active';
      saveItems();
      renderList();
    }

    function changeSeason(id, delta) {
      const item = findItem(id);
      if (!item || item.type !== 'series') return;
      item.season = Math.max(1, (item.season || 1) + delta);
      item.episode = 0;
      saveItems();
      renderList();
    }

    function deleteItem(id) {
      items = items.filter(item => item.id !== Number(id));
      saveItems();
      renderList();
    }

    function rateItem(id, value) {
      const item = findItem(id);
      if (!item) return;
      item.rating = item.rating === Number(value) ? 0 : Number(value);
      saveItems();
      renderList();
    }

    function handleClick(event) {
      const btn = event.target.closest('[data-role]');
      if (!btn) return;
      const id = Number(btn.dataset.id);
      const role = btn.dataset.role;

      if (role === 'delete') deleteItem(id);
      if (role === 'status') return;
      if (role === 'season-up') changeSeason(id, 1);
      if (role === 'season-down') changeSeason(id, -1);
      if (role === 'episode-up') changeEpisode(id, 1);
      if (role === 'episode-down') changeEpisode(id, -1);
      if (role === 'rate') rateItem(id, btn.dataset.v);
    }

    function handleChange(event) {
      const target = event.target;
      const id = Number(target.dataset.id);

      if (target.matches('.status')) {
        updateStatus(id, target.value);
        return;
      }
    }

    function randomPick() {
      const wants = items.filter(item => item.status === 'want');
      if (!wants.length) {
        alert('ما عندك أي شيء في "أبغى أشاهده". أضف أول فيلم أو مسلسل.');
        return;
      }
      const picked = wants[Math.floor(Math.random() * wants.length)];
      alert(`الليلة شاهد: ${picked.title}`);
    }

    elements.form.addEventListener('submit', addItem);
    elements.type.addEventListener('change', updateTypeFields);
    elements.search.addEventListener('input', renderList);
    elements.filterGenre.addEventListener('change', renderList);
    elements.sortBy.addEventListener('change', renderList);
    document.addEventListener('click', handleClick);
    document.addEventListener('change', handleChange);
    elements.randomBtn.addEventListener('click', randomPick);

    renderFilters();
    updateTypeFields();
    renderList();
  </script>
</body>
</html>
